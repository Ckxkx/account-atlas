name: Deploy web app (gh-pages)

# Triggered by pushes that touch the web files.
# The web app is served by GitHub Pages from this repo's gh-pages branch (Pages source = gh-pages / root)
# at https://huichen.dev/account-atlas/ (huichen.dev is the user site's custom domain).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'app.js', 'styles.css', 'sw.js', 'manifest.webmanifest', 'logo.svg', 'icon.png', 'icon-512.png', 'icons/**', 'version.json', 'tools/version-json.mjs', '.github/workflows/web.yml']

permissions:
  contents: write

concurrency:
  group: web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push web files to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir site
          cp index.html app.js styles.css sw.js manifest.webmanifest logo.svg icon.png icon-512.png site/
          cp -R icons site/icons
          # version.json for the iOS / Android 检查更新: always the latest PUBLISHED release (never a version whose
          # APK / IPA don't exist yet); notes from the repo's version.json or that release's notes. See RELEASING.md.
          if gh release view --repo "${{ github.repository }}" --json tagName,body > rel.json 2>/dev/null; then
            jq -r .body rel.json > rel.md
            node tools/version-json.mjs "$(jq -r .tagName rel.json)" rel.md site/version.json || { echo "::warning::version.json not written"; rm -f site/version.json; }
          else
            echo "no release yet: no version.json"
          fi
          touch site/.nojekyll
          cd site
          git init -q -b gh-pages
          git add -A
          git -c user.name=Ckxkx -c user.email=138646608+Ckxkx@users.noreply.github.com commit -qm "Deploy web app ($(git -C .. rev-parse --short HEAD))"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
          echo "deployed to ${{ github.repository }}@gh-pages"
