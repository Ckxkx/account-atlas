name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'icons/**', '.github/workflows/android.yml']

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$KS_B64" || { echo "::error::ANDROID_KEYSTORE_B64 secret missing"; exit 1; }
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/atlas.jks"
      - name: Test + build signed release APK
        working-directory: android
        env:
          ATLAS_KEYSTORE: ${{ runner.temp }}/atlas.jks
          ATLAS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ATLAS_BUILD: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testReleaseUnitTest assembleRelease
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/Atlas.apk"
          ls -la "$GITHUB_WORKSPACE/Atlas.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Atlas-apk
          path: Atlas.apk
      - name: Publish APK to the apk branch
        run: |
          mkdir out && cp Atlas.apk out/ && cd out
          git init -q -b apk && git add . && git -c user.name=atlas-bot -c user.email=bot@users.noreply.github.com commit -qm "APK r${{ github.run_number }} ($(git -C .. log -1 --format=%h))"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk
      - name: Publish GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          MSG=$(git log -1 --format=%s)
          gh release create "android-v1.0-r${{ github.run_number }}" Atlas.apk --repo "$R" --target "${{ github.sha }}" \
            --title "账号星图 安卓版 1.0 · 构建 ${{ github.run_number }}" --latest=false \
            --notes "安卓 APK（Android 8.0+），直接下载 Atlas.apk 安装；以后的版本会覆盖安装，数据保留。本次：$MSG"
          # also attach the APK to the newest iOS release, so the latest release carries both files
          IOS=$(gh release list --repo "$R" --limit 100 --json tagName,createdAt -q '[.[] | select(.tagName | startswith("v2.0-r"))] | sort_by(.createdAt) | reverse | .[0].tagName // empty')
          if [ -n "$IOS" ]; then gh release upload "$IOS" Atlas.apk --repo "$R" --clobber && echo "attached to $IOS"; fi

  shots:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Atlas-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash android/ci/shots.sh Atlas.apk shots
      - name: Publish screenshots to the shots branch (android/)
        run: |
          set -e
          git config --global user.name atlas-bot; git config --global user.email bot@users.noreply.github.com
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          for try in 1 2 3; do
            rm -rf sb
            if git clone -q --depth 1 -b shots "$URL" sb; then :; else mkdir sb && git -C sb init -q -b shots; fi
            rm -rf sb/android && mkdir -p sb/android && cp shots/*.png shots/*.log sb/android/ 2>/dev/null || true
            cd sb && git add -A && (git commit -qm "android shots r${{ github.run_number }}" || true)
            if git push -q "$URL" HEAD:shots; then exit 0; fi
            cd ..; sleep 5
          done
          exit 1
