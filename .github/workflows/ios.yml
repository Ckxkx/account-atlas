name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ios/**', 'native/**', 'icons/**', '.github/workflows/ios.yml']

concurrency:
  group: ios
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned IPA
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          APP=build/Payload/Atlas.app
          mkdir -p "$APP/www" build
          xcrun -sdk iphoneos swiftc -parse-as-library -O -swift-version 5 -target arm64-apple-ios17.0 -sdk "$SDK" native/*.swift -o "$APP/Atlas" 2>&1 | tee build/swiftc.log
          test -f "$APP/Atlas"
          rmdir "$APP/www"; cp -R icons "$APP/icons"; cp -R native/lproj/*.lproj "$APP/"; for f in "$APP"/*.lproj/InfoPlist.strings; do plutil -convert binary1 "$f"; done
          VER=$(grep -oE 'app.js\?v=[0-9]+' index.html | grep -oE '[0-9]+$')
          sed -e "s/__VERSION__/2.0/" -e "s/__BUILD__/$VER/" native/Info.plist > "$APP/Info.plist"
          xcrun actool ios/Assets.xcassets --compile "$APP" --platform iphoneos --minimum-deployment-target 17.0 \
            --app-icon AppIcon --output-partial-info-plist build/partial.plist --target-device iphone
          /usr/libexec/PlistBuddy -c "Merge build/partial.plist" "$APP/Info.plist"
          for k in DTPlatformName:iphoneos DTSDKName:iphoneos$(xcrun --sdk iphoneos --show-sdk-version); do
            /usr/libexec/PlistBuddy -c "Add :${k%%:*} string ${k#*:}" "$APP/Info.plist"; done
          plutil -convert binary1 "$APP/Info.plist"
          echo -n 'APPL????' > "$APP/PkgInfo"
          cd build && zip -qX -D "../Atlas-$VER.ipa" "Payload/Atlas.app/Info.plist" && zip -qrXy "../Atlas-$VER.ipa" Payload -x "Payload/Atlas.app/Info.plist" && cd ..   # Info.plist first: sign tools that scan local headers (全能签 etc.) find it even on a partial download
          ls -la *.ipa; file "$APP/Atlas"
      - uses: actions/upload-artifact@v4
        with:
          name: Atlas-ipa
          path: '*.ipa'
      - name: Publish IPA to the ipa branch
        run: |
          mkdir out && cp *.ipa out/ && cd out
          git init -q -b ipa && git add . && git -c user.name=atlas-bot -c user.email=bot@users.noreply.github.com commit -qm "IPA $(ls *.ipa)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ipa
      - name: Publish release to the public repo
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          PUB: Ckxkx/account-atlas
          SRC_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "::error::PUBLIC_REPO_TOKEN secret missing"; exit 1; }
          F=$(ls Atlas-*.ipa); cp "$F" Atlas.ipa
          N=$(( ${{ github.run_number }} + 100 ))   # continue the old public numbering (old repo ended at r19)
          MSG=$(git log -1 --format=%s)
          # releases and tags point at the public repo's own main, never at private source
          TARGET=$(gh api "repos/$PUB/commits/main" -q .sha)
          # carry the newest Android APK too (from this private repo's apk branch), so the latest release has both files
          FILES="Atlas.ipa"
          if git clone -q --depth 1 -b apk "https://x-access-token:${SRC_TOKEN}@github.com/${{ github.repository }}.git" apkb && [ -f apkb/Atlas.apk ]; then
            cp apkb/Atlas.apk Atlas.apk; FILES="Atlas.ipa Atlas.apk"
          else echo "::warning::no APK on the apk branch yet"; fi
          gh release create "v2.0-r$N" $FILES --repo "$PUB" --target "$TARGET" --latest \
            --title "账号星图 2.0 · 构建 $N" \
            --notes "Atlas.ipa：未签名 iOS 包，用 SideStore / 爱思助手 / Sideloadly 自签后安装。Atlas.apk：安卓包，直接安装。本次：$MSG"
          gh release view "v2.0-r$N" --repo "$PUB" --json url,assets -q '.url, (.assets[].name)'

  preview:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build for simulator and take screenshots
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          APP=sim/Atlas.app
          mkdir -p "$APP" shots
          xcrun -sdk iphonesimulator swiftc -parse-as-library -Onone -swift-version 5 -target arm64-apple-ios17.0-simulator -sdk "$SDK" native/*.swift -o "$APP/Atlas"
          cp -R icons "$APP/icons"; cp -R native/lproj/*.lproj "$APP/"
          sed -e "s/__VERSION__/2.0/" -e "s/__BUILD__/1/" native/Info.plist > "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleSupportedPlatforms" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleSupportedPlatforms array" -c "Add :CFBundleSupportedPlatforms:0 string iPhoneSimulator" "$APP/Info.plist"
          xcrun actool ios/Assets.xcassets --compile "$APP" --platform iphonesimulator --minimum-deployment-target 17.0 \
            --app-icon AppIcon --output-partial-info-plist sim/partial.plist --target-device iphone
          /usr/libexec/PlistBuddy -c "Merge sim/partial.plist" "$APP/Info.plist"
          codesign -s - --force "$APP"
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone 16 Pro') or x['name'].startswith('iPhone 17 Pro')];c=c or [x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')];print(c[-1]['udid'])")
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryLevel 100 --cellularBars 4 || true
          xcrun simctl install "$UDID" "$APP"
          shot() { xcrun simctl terminate "$UDID" dev.huichen.atlas || true; xcrun simctl launch "$UDID" dev.huichen.atlas "${@:2}"; sleep 7; xcrun simctl io "$UDID" screenshot "shots/$1.png"; }
          shot 1-wallet
          shot 2-wallet-light -atlas.theme light
          shot 3-sites -atlasTab 1
          shot 4-map -atlasTab 2
          shot 5-identity -atlasRoute identity
          shot 6-picker -atlasRoute picker
          shot 7-settings -atlasRoute settings
          shot 8-new -atlasRoute new
          ls shots
          # promo clips: each scripted demo recorded at native resolution
          mkdir -p clips
          clip() {
            xcrun simctl terminate "$UDID" dev.huichen.atlas || true
            xcrun simctl launch "$UDID" dev.huichen.atlas -atlasDemo "$1" "${@:3}"
            sleep 1.6
            xcrun simctl io "$UDID" recordVideo --codec h264 --force "clips/$1.mp4" & REC=$!
            sleep "$2"; kill -INT $REC; wait $REC || true
          }
          clip wallet 10 -atlas.theme light; mv clips/wallet.mp4 clips/wallet-light.mp4
          clip wallet 10 -atlas.theme dark
          clip kind 7 -atlas.theme dark
          clip map 9 -atlas.theme dark
          clip theme 10 -atlas.theme dark
          clip tabs 7 -atlas.theme dark
          clip picker 5.5 -atlas.theme dark
          ls -la clips
      - name: Publish screenshots
        run: |
          mkdir out && cp shots/*.png out/ && cp clips/*.mp4 out/
          # keep the Android screenshots that live in the same branch
          git clone -q --depth 1 -b shots "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" prev 2>/dev/null && [ -d prev/android ] && cp -R prev/android out/ || true
          cd out
          git init -q -b shots && git add . && git -c user.name=atlas-bot -c user.email=bot@users.noreply.github.com commit -qm "shots"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" shots
