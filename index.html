<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07070d" />
  <meta name="description" content="Atlas — 记清每个邮箱和手机号注册了哪些网站与 App" />
  <title>Atlas · 账号星图</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%238b5cf6'/><stop offset='1' stop-color='%2306b6d4'/></linearGradient></defs><circle cx='32' cy='32' r='28' fill='url(%23g)'/><circle cx='32' cy='32' r='8' fill='white'/></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- animated aurora background -->
  <div class="aurora" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
    <div class="grain"></div>
  </div>
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="spotlight" aria-hidden="true"></div>

  <div class="app">
    <header class="topbar reveal">
      <div class="brand">
        <div class="logo"><span></span></div>
        <div>
          <div class="brand-name">Atlas</div>
          <div class="brand-sub">账号星图</div>
        </div>
      </div>
      <button class="search-pill" id="openPalette">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span>搜索网站、邮箱、手机号…</span>
        <kbd>⌘K</kbd>
      </button>
      <div class="top-actions">
        <button class="icon-btn" id="menuBtn" title="数据">
          <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
        </button>
        <div class="menu" id="menu">
          <button data-act="export">导出备份 (JSON)</button>
          <button data-act="import">导入备份</button>
          <button data-act="demo">载入示例数据</button>
          <hr />
          <button data-act="wipe" class="danger">清空全部数据</button>
        </div>
      </div>
    </header>

    <section class="hero reveal" style="--d:.08s">
      <h1>每个账号，<span class="grad">都有迹可循。</span></h1>
      <p>记下哪个邮箱、哪个手机号注册了哪些网站和 App。数据只保存在你的浏览器里，不上传任何服务器，也从不记录密码。</p>
      <div class="stats">
        <div class="stat"><b data-count="emails">0</b><span>邮箱</span></div>
        <div class="stat"><b data-count="phones">0</b><span>手机号</span></div>
        <div class="stat"><b data-count="accounts">0</b><span>网站 / App</span></div>
        <div class="stat"><b data-count="links">0</b><span>绑定关系</span></div>
      </div>
    </section>

    <nav class="tabs reveal" style="--d:.16s" role="tablist">
      <div class="tab-indicator"></div>
      <button class="tab active" data-tab="identities">身份</button>
      <button class="tab" data-tab="accounts">网站 / App</button>
      <button class="tab" data-tab="graph">星图</button>
    </nav>

    <main class="views reveal" style="--d:.24s">
      <!-- identities -->
      <section class="view active" data-view="identities">
        <div class="view-head">
          <div class="seg" id="idFilter">
            <button class="active" data-f="all">全部</button>
            <button data-f="email">邮箱</button>
            <button data-f="phone">手机号</button>
          </div>
          <button class="btn primary" data-open="identity">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>添加身份
          </button>
        </div>
        <div class="grid" id="identityGrid"></div>
      </section>

      <!-- accounts -->
      <section class="view" data-view="accounts">
        <div class="view-head">
          <div class="chips" id="catChips"></div>
          <button class="btn primary" data-open="account">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>添加网站
          </button>
        </div>
        <div class="list" id="accountList"></div>
      </section>

      <!-- graph -->
      <section class="view" data-view="graph">
        <div class="graph-wrap">
          <canvas id="graph"></canvas>
          <div class="graph-tip" id="graphTip"></div>
          <div class="graph-legend">
            <span><i class="dot email"></i>邮箱</span>
            <span><i class="dot phone"></i>手机号</span>
            <span><i class="dot site"></i>网站 / App</span>
            <em>拖动节点 · 悬停高亮 · 点击查看</em>
          </div>
        </div>
      </section>
    </main>

    <footer class="foot">数据仅存于本机 localStorage · 记得定期导出备份</footer>
  </div>

  <!-- drawer -->
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-hidden="true"></aside>

  <!-- modal -->
  <div class="modal-layer" id="modalLayer">
    <div class="modal" id="modal"></div>
  </div>

  <!-- palette -->
  <div class="palette-layer" id="paletteLayer">
    <div class="palette">
      <div class="palette-input">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="paletteInput" placeholder="比如：github、qq.com、138…" autocomplete="off" />
        <kbd>esc</kbd>
      </div>
      <div class="palette-results" id="paletteResults"></div>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>
  <input type="file" id="fileInput" accept="application/json" hidden />

  <script src="app.js"></script>
</body>
</html>
