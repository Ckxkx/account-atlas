<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="账号" />
  <meta name="description" content="每个邮箱和手机号注册了哪些网站与 App，一眼看清" />
  <title>账号 · Atlas</title>
  <link rel="icon" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="glow" id="glow"></div>

  <header class="top" id="top">
    <div class="top-bar">
      <div class="top-title" id="topTitle">账号</div>
      <div class="top-actions">
        <button class="round" id="openSearch" aria-label="搜索"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg></button>
        <button class="round" id="addBtn" aria-label="添加"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="round" id="menuBtn" aria-label="更多"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.3" class="f"/><circle cx="12" cy="12" r="1.3" class="f"/><circle cx="18" cy="12" r="1.3" class="f"/></svg></button>
      </div>
    </div>
    <div class="menu" id="menu" role="menu">
      <button data-act="privacy"><span>隐藏号码</span><svg viewBox="0 0 24 24"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6Z"/><circle cx="12" cy="12" r="2.5"/></svg></button>
      <button data-act="export"><span>导出备份</span><svg viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg></button>
      <button data-act="import"><span>导入备份</span><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg></button>
      <button data-act="demo"><span>载入示例</span><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
      <div class="menu-sep"></div>
      <button data-act="wipe" class="destructive"><span>清空全部数据</span><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
    </div>
  </header>

  <main>
    <!-- 首页 -->
    <section class="view active" data-view="home">
      <div class="hello">
        <h1 class="large">账号</h1>
        <p class="summary" id="summary"></p>
      </div>
      <div class="wallet" id="wallet"></div>
      <div class="dots" id="dots"></div>

      <div class="block">
        <div class="block-head"><div><h2 id="gridTitle"></h2><p class="block-sub" id="gridSub"></p></div><button class="pill-btn" id="gridAdd"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>添加</button></div>
        <div class="panel"><div class="grid" id="grid"></div></div>
      </div>

      <div class="block">
        <div class="block-head"><div><h2>最近添加</h2><p class="block-sub">按时间排列</p></div></div>
        <div class="timeline" id="timeline"></div>
      </div>
    </section>

    <!-- 全部网站 -->
    <section class="view" data-view="sites">
      <div class="hello"><h1 class="large">网站与 App</h1><p class="summary" id="sitesSummary"></p></div>
      <div class="filters" id="filters"></div>
      <div id="siteList"></div>
    </section>

    <!-- 星图 -->
    <section class="view" data-view="graph">
      <div class="hello"><h1 class="large">关系图</h1><p class="summary">线连着的，就是用这个邮箱或手机号注册、绑定的</p></div>
      <div class="graph-card"><canvas id="graph"></canvas></div>
    </section>

    <p class="footnote">所有内容只保存在这台设备的浏览器里，不上传，不记录密码。换设备时用“导出备份”。</p>
  </main>

  <nav class="tabbar" id="tabbar">
    <span class="tab-thumb" id="tabThumb"></span>
    <button class="active" data-tab="home"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18"/></svg><span>卡包</span></button>
    <button data-tab="sites"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.8"/></svg><span>全部 App</span></button>
    <button data-tab="graph"><svg viewBox="0 0 24 24"><circle cx="6" cy="7" r="2.3"/><circle cx="18" cy="6" r="2.3"/><circle cx="12" cy="17.5" r="2.3"/><path d="M8 8l2.8 7.6M16.3 7.6 13.3 15.6M8.3 6.8l7.4-.6"/></svg><span>关系图</span></button>
  </nav>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grabber"></div><div class="sheet-inner" id="sheetInner"></div></div>

  <div class="spot-layer" id="spotLayer">
    <div class="spot">
      <div class="spot-field">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg>
        <input id="spotInput" placeholder="网站名、邮箱，或号码后四位" autocomplete="off" enterkeyhint="search" />
        <button class="spot-cancel" id="spotCancel">取消</button>
      </div>
      <div class="spot-results" id="spotResults"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <input type="file" id="fileInput" accept="application/json" hidden />
  <script src="app.js"></script>
</body>
</html>
